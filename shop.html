<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — New England Drive</title>
  <style>
    :root {
      --bg-color: #f7f5f0;        /* Off-white */
      --header-bg: #2b1e16;      /* Dark chocolate brown */
      --header-text: #f7f5f0;    /* Off-white text */
      --text-color: #2b1e16;      /* Dark chocolate body text */
      --accent-color: #5c4333;    /* Warm muted brown accent */
      --border-color: #e2ddd5;    /* Soft neutral border */
      --font-family: 'Georgia', 'Garamond', 'Times New Roman', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }

    /* Dark Chocolate Header */
    header {
      background-color: var(--header-bg);
      color: var(--header-text);
      padding: 2.25rem 3.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
    }

    .logo-link {
      color: var(--header-text);
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 5px;
      text-transform: capitalize;
      font-weight: 400;
      line-height: 1.2;
      transition: opacity 0.3s ease;
    }

    .tagline {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: capitalize;
      color: var(--header-text);
      opacity: 0.75;
      margin-top: 0.25rem;
      font-weight: 300;
    }

    .logo-link:hover { opacity: 0.8; }

    nav a {
      color: var(--header-text);
      margin-left: 2.75rem;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }

    nav a.active {
      border-bottom: 1px solid var(--header-text);
      padding-bottom: 4px;
    }

    nav a:hover { opacity: 0.75; }

    /* Layout */
    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 5rem 2.5rem;
    }

    .split-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 5rem;
      align-items: center;
      margin-bottom: 5rem;
    }

    .image-wrapper {
      width: 100%;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(43, 30, 22, 0.03);
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .content-wrapper {
      padding-left: 1rem;
    }

    .sub-title {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 1.25rem;
      display: block;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      line-height: 1.35;
      margin-bottom: 1.75rem;
      color: var(--text-color);
    }

    .body-text {
      font-size: 1.05rem;
      color: var(--text-color);
      opacity: 0.9;
      font-weight: 400;
    }

    /* Product Section */
    .section-title {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: capitalize;
      color: var(--text-color);
      margin-bottom: 2.5rem;
      text-align: center;
      border-top: 1px solid var(--border-color);
      padding-top: 4rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2.5rem;
      margin-bottom: 5rem;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(43, 30, 22, 0.08);
    }

    .product-thumb {
      width: 100%;
      height: 240px;
      object-fit: contain;
      background-color: #fafafa;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem;
    }

    .product-category {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: capitalize;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    .product-title {
      font-size: 1.15rem;
      font-weight: 400;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .product-summary {
      font-size: 0.85rem;
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    .btn-details {
      align-self: start;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: capitalize;
      color: var(--header-bg);
      border-bottom: 1px solid var(--header-bg);
      padding-bottom: 2px;
    }

    /* Partner Section */
    .partner-section {
      padding-top: 3.5rem;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .partner-tag {
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 1.5rem;
      display: block;
    }

    .partner-logo-container {
      max-width: 220px;
      margin: 0 auto;
      opacity: 0.9;
      transition: opacity 0.3s ease;
    }

    .partner-logo-container img {
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: multiply;
    }

    .partner-desc {
      font-size: 0.95rem;
      color: var(--text-color);
      opacity: 0.85;
      margin-top: 1.25rem;
      font-style: italic;
    }

    footer {
      background-color: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 3.5rem 2rem;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 7rem;
    }

    @media (max-width: 900px) {
      header { padding: 1.75rem 2rem; flex-direction: column; gap: 1.25rem; text-align: center; }
      .brand-container { align-items: center; }
      nav a { margin: 0 0.85rem; }
      .split-layout { grid-template-columns: 1fr; gap: 3rem; }
      .product-grid { grid-template-columns: 1fr; }
      .content-wrapper { padding-left: 0; }
    }

    
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <a href="index.html" class="logo-link">New England Drive</a>
      <span class="tagline">Sim racing specialist</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="schedule.html">Schedule</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  
      </div>

      <div class="content-wrapper">
        
        <h1>Coming soon</h1>
        
      </div>
    </div>

    
    </div>

    <section class="partner-section">
      <span class="partner-tag">Authorized Dealer &amp; Integration Partner</span>
      <div class="partner-logo-container">
        <img src="images/sabelt-logo.png" alt="Sabelt Sim Racing Authorized Dealer">
      </div>
      <p class="partner-desc">Official supplier of Sabelt products.</p>
    </section>

  </main>

  <footer>
    &copy; 2026 New England Drive. All rights reserved.
  </footer>

</body>
</html>
