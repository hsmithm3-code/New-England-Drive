<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware — New England Drive</title>
  <style>
    :root {
      --bg-color: #f7f5f0;        /* Off-white */
      --header-bg: #2b1e16;      /* Dark chocolate brown */
      --header-text: #f7f5f0;    /* Off-white text */
      --text-color: #2b1e16;      /* Dark chocolate body text */
      --accent-color: #5c4333;    /* Warm muted brown accent */
      --border-color: #e2ddd5;    /* Soft neutral border */
      --card-bg: #ffffff;
      --font-family: 'Georgia', 'Garamond', 'Times New Roman', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background-color: var(--header-bg);
      color: var(--header-text);
      padding: 2.25rem 3.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
    }

    .logo-link {
      color: var(--header-text);
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      font-weight: 400;
      line-height: 1.2;
    }

    .tagline {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--header-text);
      opacity: 0.75;
      margin-top: 0.25rem;
      font-weight: 300;
    }

    nav a {
      color: var(--header-text);
      margin-left: 2.75rem;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }

    nav a.active {
      border-bottom: 1px solid var(--header-text);
      padding-bottom: 4px;
    }

    /* Main Container */
    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 3.5rem 2.5rem 6rem;
    }

    .page-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    h1.page-title {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-color);
    }

    /* Controls */
    .shop-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-tabs {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.45rem 1.15rem;
      font-family: var(--font-family);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: var(--header-bg);
      color: var(--header-text);
      border-color: var(--header-bg);
    }

    .search-input {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      background-color: #fff;
      font-family: var(--font-family);
      font-size: 0.85rem;
      width: 250px;
      outline: none;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(43, 30, 22, 0.06);
    }

    /* Brand Header Bar */
    .brand-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      height: 22px;
    }

    .sabelt-logo-img {
      height: 20px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .brand-fallback-text {
      font-family: 'Arial Black', sans-serif;
      font-style: italic;
      font-weight: 900;
      letter-spacing: 1px;
      font-size: 0.85rem;
      color: #111111;
      text-transform: uppercase;
    }

    .product-image-container {
      width: 100%;
      height: 180px;
      background-color: #fcfbf9;
      border: 1px solid var(--border-color);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image-container img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      mix-blend-mode: multiply;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-image-container img {
      transform: scale(1.04);
    }

    .product-code {
      font-size: 0.6rem;
      letter-spacing: 1px;
      color: #888;
      font-family: monospace;
    }

    .badge {
      font-size: 0.55rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0.15rem 0.4rem;
      border-radius: 2px;
      font-family: sans-serif;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    .badge-stock { background-color: #e8f5e9; color: #2e7d32; }
    .badge-preorder { background-color: #fff3e0; color: #e65100; }
    .badge-limited { background-color: #ffebee; color: #c62828; }

    .product-name {
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.4;
      margin-bottom: 1rem;
      color: var(--text-color);
      min-height: 2.7rem;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.85rem;
      border-top: 1px dashed var(--border-color);
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text-color);
    }

    .inquire-btn {
      color: var(--header-bg);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--header-bg);
      padding-bottom: 2px;
    }

    footer {
      background-color: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 3.5rem 2rem;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <a href="index.html" class="logo-link">New England Drive</a>
      <span class="tagline">Sim racing specialist</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="schedule.html">Schedule</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">

    <div class="page-header">
      <h1 class="page-title">Hardware</h1>
    </div>

    <div class="shop-controls">
      <div class="filter-tabs">
        <button class="filter-btn active" onclick="filterCategory('ALL', this)">All</button>
        <button class="filter-btn" onclick="filterCategory('COCKPITS', this)">Cockpits</button>
        <button class="filter-btn" onclick="filterCategory('SEATS', this)">Seats</button>
        <button class="filter-btn" onclick="filterCategory('ACCESSORIES', this)">Mounts &amp; Accessories</button>
        <button class="filter-btn" onclick="filterCategory('EQUIPMENTS', this)">Apparel &amp; Gear</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search hardware..." onkeyup="filterCatalog()">
    </div>

    <div class="product-grid" id="productGrid"></div>

  </main>

  <footer>
    &copy; 2026 New England Drive. All rights reserved.
  </footer>

  <script>
    const products = [
      { brand: "Sabelt", cat: "COCKPITS", code: "00000-03-01", name: "Sabelt S97 Cockpit — Grey", price: 679, note: "Discontinued", img: "images/s97-grey.png" },
      { brand: "Sabelt", cat: "COCKPITS", code: "00000-04-01", name: "Sabelt S99 EVO I Cockpit — Black", price: 1279, note: "", img: "images/s99-evo.png" },
      { brand: "Sabelt", cat: "COCKPITS", code: "00001-04-02", name: "Sabelt P99 EVO I Cockpit — Black", price: 1279, note: "", img: "images/p99-evo.png" },
      { brand: "Sabelt", cat: "COCKPITS", code: "00002-04-03", name: "Sabelt X99 EVO I Cockpit — Black", price: 1279, note: "", img: "images/x99-evo.png" },
      { brand: "Sabelt", cat: "COCKPITS", code: "00003-04-03", name: "Sabelt LIT3 Cockpit — Black", price: 799, note: "Pre-Order", img: "images/lit3-black.png" },
      { brand: "Sabelt", cat: "SEATS", code: "00210-01-01-BLK", name: "SRS-1 Deep Black (Blk Seat + Blk Pads)", price: 699, note: "", img: "images/srs1-black.png" },
      { brand: "Sabelt", cat: "SEATS", code: "00211-01-02-BLK", name: "SRP-1 Deep Black (Blk Seat + Blk Pads)", price: 749, note: "", img: "images/srp1-black.png" },
      { brand: "Sabelt", cat: "SEATS", code: "00212-01-03-BLK", name: "SRX-1 Deep Black (Blk Seat + Blk Pads)", price: 899, note: "", img: "images/srx1-black.png" }
    ];

    let currentCategory = 'ALL';

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const searchInput = document.getElementById('searchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      grid.innerHTML = '';

      products.forEach(p => {
        const matchesCategory = (currentCategory === 'ALL' || p.cat === currentCategory);
        const matchesSearch = (query === '' || p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query));

        if (matchesCategory && matchesSearch) {
          
          let badgeHtml = p.note ? `<span class="badge ${p.note.toLowerCase().includes('pre-order') ? 'badge-preorder' : 'badge-limited'}">${p.note}</span>` : '';
          
          let brandHeader = '';
          if (p.brand === 'Sabelt') {
            brandHeader = `
              <div class="brand-header-bar">
                <img src="images/Sabeltlogo.png" alt="Sabelt" class="sabelt-logo-img">
                <span class="product-code">${p.code}</span>
              </div>
            `;
          } else {
            brandHeader = `
              <div class="brand-header-bar">
                <span class="brand-fallback-text">${p.brand}</span>
                <span class="product-code">${p.code}</span>
              </div>
            `;
          }

          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <div>
              ${brandHeader}
              <div class="product-image-container">
                <img src="${p.img}" alt="${p.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200/fcfbf9/2b1e16?text=${encodeURIComponent(p.brand)}';">
              </div>
              ${badgeHtml ? `<div>${badgeHtml}</div>` : ''}
              <h3 class="product-name">${p.name}</h3>
            </div>
            <div class="product-footer">
              <span class="product-price">$${p.price.toLocaleString()}</span>
              <a href="contact.html?item=${encodeURIComponent(p.code)}" class="inquire-btn">Inquire</a>
            </div>
          `;
          grid.appendChild(card);
        }
      });
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function filterCatalog() { renderProducts(); }

    window.addEventListener('DOMContentLoaded', renderProducts);
  </script>

</body>
</html>
