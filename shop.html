<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware — New England Drive</title>
  <style>
    :root {
      --bg-color: #f7f5f0;        /* Off-white */
      --header-bg: #2b1e16;      /* Dark chocolate brown */
      --header-text: #f7f5f0;    /* Off-white text */
      --text-color: #2b1e16;      /* Dark chocolate body text */
      --accent-color: #5c4333;    /* Warm muted brown accent */
      --border-color: #e2ddd5;    /* Soft neutral border */
      --card-bg: #ffffff;
      --font-family: 'Georgia', 'Garamond', 'Times New Roman', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }

    /* Dark Chocolate Header */
    header {
      background-color: var(--header-bg);
      color: var(--header-text);
      padding: 2.25rem 3.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
    }

    .logo-link {
      color: var(--header-text);
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      font-weight: 400;
      line-height: 1.2;
      transition: opacity 0.3s ease;
    }

    .tagline {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--header-text);
      opacity: 0.75;
      margin-top: 0.25rem;
      font-weight: 300;
    }

    .logo-link:hover { opacity: 0.8; }

    nav a {
      color: var(--header-text);
      margin-left: 2.75rem;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }

    nav a.active {
      border-bottom: 1px solid var(--header-text);
      padding-bottom: 4px;
    }

    nav a:hover { opacity: 0.75; }

    /* Layout */
    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 3.5rem 2.5rem 6rem;
    }

    .page-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    h1.page-title {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-color);
      margin-bottom: 0.5rem;
    }

    /* Controls: Filter & Search */
    .shop-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-tabs {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.45rem 1.15rem;
      font-family: var(--font-family);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: var(--header-bg);
      color: var(--header-text);
      border-color: var(--header-bg);
    }

    .search-input {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      background-color: #fff;
      font-family: var(--font-family);
      font-size: 0.85rem;
      width: 250px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    /* Grid Layout */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(43, 30, 22, 0.06);
    }

    /* Product Image Wrapper */
    .product-image-container {
      width: 100%;
      height: 180px;
      background-color: #fcfbf9;
      border: 1px solid var(--border-color);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .product-image-container img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      mix-blend-mode: multiply;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-image-container img {
      transform: scale(1.04);
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .brand-tag {
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--accent-color);
    }

    .product-code {
      font-size: 0.6rem;
      letter-spacing: 1px;
      color: #888;
      font-family: monospace;
    }

    .badge {
      font-size: 0.55rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0.15rem 0.4rem;
      border-radius: 2px;
      font-family: sans-serif;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    .badge-stock { background-color: #e8f5e9; color: #2e7d32; }
    .badge-preorder { background-color: #fff3e0; color: #e65100; }
    .badge-limited { background-color: #ffebee; color: #c62828; }

    .product-name {
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.4;
      margin-bottom: 1rem;
      color: var(--text-color);
      min-height: 2.7rem;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.85rem;
      border-top: 1px dashed var(--border-color);
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text-color);
    }

    .inquire-btn {
      color: var(--header-bg);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--header-bg);
      padding-bottom: 2px;
      transition: opacity 0.3s ease;
    }

    .inquire-btn:hover { opacity: 0.6; }

    .no-results {
      text-align: center;
      padding: 4rem 1rem;
      font-size: 1rem;
      color: var(--accent-color);
      display: none;
    }

    /* Dark Chocolate Footer */
    footer {
      background-color: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 3.5rem 2rem;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6rem;
    }

    @media (max-width: 900px) {
      header { padding: 1.75rem 2rem; flex-direction: column; gap: 1.25rem; text-align: center; }
      .brand-container { align-items: center; }
      nav a { margin: 0 0.85rem; }
      .shop-controls { flex-direction: column; align-items: stretch; }
      .search-input { width: 100%; }
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    }
  </style>
</head>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid"></div>

  </main>

    let currentCategory = 'ALL';

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      grid.innerHTML = '';
      let visibleCount = 0;

      products.forEach(p => {
        const matchesCategory = (currentCategory === 'ALL' || p.cat === currentCategory);
        const matchesSearch = (query === '' || p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query) || p.brand.toLowerCase().includes(query));

        if (matchesCategory && matchesSearch) {
          visibleCount++;
          
          // Badge tag formatting
          let badgeHtml = '';
          if (p.note) {
            let badgeClass = 'badge-stock';
            if (p.note.toLowerCase().includes('pre-order')) badgeClass = 'badge-preorder';
            if (p.note.toLowerCase().includes('discontinued') || p.note.toLowerCase().includes('supplies')) badgeClass = 'badge-limited';
            badgeHtml = `<span class="badge ${badgeClass}">${p.note}</span>`;
          }

          // Fallback image if Sabelt web asset path varies
          const fallbackImg = `https://via.placeholder.com/300x200/fcfbf9/2b1e16?text=${encodeURIComponent(p.brand + ' Hardware')}`;

          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <div>
              <div class="product-image-container">
                <img src="${p.img}" alt="${p.name}" onerror="this.onerror=null; this.src='${fallbackImg}';">
              </div>
              <div class="product-meta">
                <span class="brand-tag">${p.brand}</span>
                <span class="product-code">${p.code}</span>
              </div>
              ${badgeHtml ? `<div>${badgeHtml}</div>` : ''}
              <h3 class="product-name">${p.name}</h3>
            </div>
            <div class="product-footer">
              <span class="product-price">$${p.price.toLocaleString()}</span>
              <a href="contact.html?item=${encodeURIComponent(p.code)}" class="inquire-btn">Inquire</a>
            </div>
          `;
          grid.appendChild(card);
        }
      });

      document.getElementById('noResults').style.display = (visibleCount === 0) ? 'block' : 'none';
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function filterCatalog() {
      renderProducts();
    }

    // Initial render on load
    window.addEventListener('DOMContentLoaded', renderProducts);
  </script>
